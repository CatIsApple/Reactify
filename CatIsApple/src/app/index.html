<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>DOM 편집기 · Reactify</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="../../dist/app/main.js"></script>
</head>
<body>
  <header class="site-header"><div class="site-bar">
    <a class="brand" href="./">Reactify <small>v1</small></a>
    <nav aria-label="실습 페이지"><a href="./" aria-current="page">DOM 편집기</a><a href="./tasks.html">할 일 목록</a></nav>
  </div></header>
  <main>
    <h1>DOM 편집기</h1>
    <p class="intro">테스트 영역이나 HTML을 수정하고 <strong>Patch</strong>를 누르면 변경한 부분이 실제 영역에 반영됩니다.</p>
    <div class="controls">
      <button id="patch" class="primary" type="button">Patch</button>
      <div class="history-controls">
        <button id="undo" type="button" disabled>뒤로가기</button>
        <button id="redo" type="button" disabled>앞으로가기</button>
        <output id="history-position" aria-label="현재 이력"></output>
      </div>
    </div>
    <div class="panes">
      <section class="pane"><h2>실제 영역</h2>
        <div class="sample-scope"><div id="actual" class="canvas"><article>
  <h3>오늘의 실습</h3>
  <p>목록을 편집하고 두 영역을 비교해 보세요.</p>
  <ul>
    <li>제목 바꾸기</li>
    <li>항목 추가하기</li>
  </ul>
</article></div></div>
      </section>
      <section class="pane"><h2>테스트 영역</h2>
        <div class="sample-scope"><div id="preview" class="canvas" contenteditable="true" aria-label="테스트 영역 편집" spellcheck="false"></div></div>
      </section>
    </div>
    <section class="source"><label for="html-editor">테스트 영역 HTML</label>
      <textarea id="html-editor" spellcheck="false" autocapitalize="off" rows="10"></textarea>
    </section>
  </main>
</body>
</html>
